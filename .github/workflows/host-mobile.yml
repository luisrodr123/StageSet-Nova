name: Host Android e iPad
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: chmod +x mobile/android/gradlew
      - run: mobile/android/gradlew -p mobile/android assembleDebug lintDebug
      - name: Permitir aceleração no emulador do runner descartável
        run: sudo chmod a+rw /dev/kvm
      - name: Testar ligação e letras em Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          disable-linux-hw-accel: false
          script: |
            node tests/mobile-server.cjs > mobile-server.log 2>&1 &
            adb reverse tcp:4186 tcp:4186
            mobile/android/gradlew -p mobile/android connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StageSet-Host-Android-test
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/androidTests
            mobile/android/app/build/outputs/androidTest-results
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: brew install xcodegen
      - run: xcodegen generate --spec mobile/ios/project.yml
      - name: Testar num simulador iPad
        shell: bash
        run: |
          node tests/mobile-server.cjs > mobile-server.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" || true' EXIT
          device=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(d=>d.isAvailable&&d.name.startsWith("iPad"));if(!d)process.exit(1);console.log(d.udid)})')
          xcodebuild -project mobile/ios/StageSetHost.xcodeproj -scheme StageSetHost -destination "platform=iOS Simulator,id=$device" -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StageSet-Host-iOS-project-and-tests
          path: |
            mobile/ios/StageSetHost.xcodeproj
            mobile/ios/StageSetHost
            mobile/ios/StageSetHostUITests
            mobile/ios/build/Logs/Test
