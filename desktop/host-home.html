<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StageSet Host</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#10141b;color:#eef4f4;font:15px/1.6 system-ui}h1{margin:0;color:#65e2c1}input{width:100%;padding:12px;background:#19232d;border:1px solid #536673;color:white;border-radius:6px}button{margin-top:15px;padding:10px 22px;background:#65e2c1;border:0;border-radius:6px;color:#10211e;font:inherit}#status{font-size:13px}small{color:#a9bac8}</style></head><body><h1>StageSet Host</h1><p>Recetor de letras para ensaios e palco.</p><form id="connect"><label>Endereço mostrado no StageSet<input id="address" type="url" placeholder="http://192.168.1.20:4180" required></label><button id="button">Ligar ao StageSet</button></form><p id="status" role="status"></p><small>Depois de ligar, indica o nome deste PC e o código da sessão. No StageSet principal, escolhe a saída de letras para este recetor. F11: ecrã inteiro.</small><script>document.getElementById('connect').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('button');b.disabled=true;document.getElementById('status').textContent='A ligar…';try{await window.stageSetReceiver.connect(document.getElementById('address').value);document.getElementById('status').textContent='Ligado';}catch(error){document.getElementById('status').textContent=error.message;}finally{b.disabled=false;}};</script></body></html>
