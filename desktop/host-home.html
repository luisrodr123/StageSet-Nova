<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StageSet Host</title><style>
*{box-sizing:border-box}body{margin:0;padding:25px;background:#10141b;color:#eef4f4;font:15px/1.5 system-ui}h1{margin:0;color:#65e2c1}h2{font-size:15px;margin:18px 0 6px}input[type=url]{width:100%;padding:11px;background:#19232d;border:1px solid #536673;color:white;border-radius:6px}button{padding:9px 15px;background:#65e2c1;border:0;border-radius:6px;color:#10211e;font:inherit;cursor:pointer}button:disabled{opacity:.6}#servers{display:grid;gap:6px;margin:8px 0}#servers button{text-align:left;background:#1b302e;color:#c8f8eb;border:1px solid #31635c}#status,#scan-status{font-size:13px;color:#a9bac8}small{color:#a9bac8}label{display:block;margin:12px 0}#version{color:#a9bac8;font-size:12px}
</style></head><body><h1>StageSet Host <span id="version"></span></h1><p>Recetor de letras para ensaios e palco.</p><h2>Computadores StageSet disponíveis</h2><button type="button" id="scan">Procurar na rede</button><div id="servers"></div><p id="scan-status" role="status"></p><h2>Introduzir endereço manualmente</h2><form id="connect"><label>Endereço mostrado no StageSet<input id="address" type="url" placeholder="http://192.168.1.20:4180" required></label><label><input id="auto" type="checkbox" checked> Recordar endereço e ligar automaticamente</label><button id="button">Ligar ao StageSet</button></form><p id="status" role="status"></p><small>Após ligar, introduz o nome deste dispositivo e o código da sessão. O StageSet deve ter os recetores de rede ativos. F11: ecrã inteiro.</small><script>
const address=document.getElementById('address'),status=document.getElementById('status'),scanStatus=document.getElementById('scan-status'),servers=document.getElementById('servers');
document.getElementById('connect').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('button');b.disabled=true;status.textContent='A ligar…';try{localStorage.setItem('host-address',address.value);localStorage.setItem('host-auto',document.getElementById('auto').checked?'true':'false');await window.stageSetReceiver.connect(address.value);status.textContent='Ligado';}catch(error){status.textContent=error.message;}finally{b.disabled=false;}};
document.getElementById('scan').onclick=async()=>{const button=document.getElementById('scan');button.disabled=true;servers.replaceChildren();scanStatus.textContent='A procurar computadores StageSet…';try{const found=await window.stageSetReceiver.discover();for(const server of found){const item=document.createElement('button');item.type='button';item.textContent=server.name+' · '+server.url+(server.version?' · v'+server.version:'');item.onclick=()=>{address.value=server.url;document.getElementById('connect').requestSubmit();};servers.append(item);}scanStatus.textContent=found.length?'Seleciona o computador pretendido.':'Nenhum encontrado. Confirma a rede e usa o endereço manual se necessário.';}catch(error){scanStatus.textContent='Não foi possível procurar: '+error.message;}finally{button.disabled=false;}};
window.stageSetReceiver.version().then(v=>document.getElementById('version').textContent='v'+v).catch(()=>{});address.value=localStorage.getItem('host-address')||'';document.getElementById('auto').checked=localStorage.getItem('host-auto')!=='false';document.getElementById('auto').onchange=e=>localStorage.setItem('host-auto',String(e.target.checked));if(address.value&&document.getElementById('auto').checked)document.getElementById('connect').requestSubmit();else document.getElementById('scan').click();
</script></body></html>
