<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StageSet Host</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;gap:5px;overflow:hidden;padding:clamp(8px,2vh,16px);background:#10141b;color:#eef4f4;font:13px/1.25 system-ui}h1{font-size:20px;line-height:1.2;margin:0;color:#65e2c1}h2{font-size:13px;margin:0}button,input{font:inherit}button{min-height:28px;padding:4px 10px;background:#65e2c1;border:0;border-radius:5px;color:#10211e;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;align-items:center;gap:8px;min-width:0}.row h2{flex:1}.subtle{margin:0;color:#a9bac8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#version{color:#a9bac8;font-size:11px}#servers{display:grid;gap:3px;align-content:start;min-height:0}#servers button{text-align:left;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#1b302e;color:#c8f8eb;border:1px solid #31635c;min-height:27px}#pages{justify-content:center}#pages[hidden]{display:none}#pages button{min-height:23px;padding:2px 8px}#connect{display:grid;gap:5px}#address{width:100%;height:31px;padding:5px 8px;background:#19232d;border:1px solid #536673;color:white;border-radius:5px}#connect label{display:flex;align-items:center;gap:6px;margin:0}#connect button{justify-self:start}#status:empty{display:none}@media(max-height:400px){body{gap:3px}h1{font-size:17px}.subtle{font-size:10px}button{min-height:25px}#address{height:27px}#servers button{min-height:24px}}
</style></head><body><h1>StageSet Host <span id="version"></span></h1><div class="row"><h2>Computadores StageSet disponíveis</h2><button type="button" id="scan">Procurar</button></div><p id="scan-status" class="subtle" role="status"></p><div id="servers"></div><div id="pages" class="row" hidden><button type="button" id="previous-page" aria-label="Resultados anteriores">←</button><span id="page-label"></span><button type="button" id="next-page" aria-label="Resultados seguintes">→</button></div><h2>Endereço manual</h2><form id="connect"><input id="address" type="url" aria-label="Endereço mostrado no StageSet" placeholder="http://192.168.1.20:4180" required><label><input id="auto" type="checkbox" checked> Recordar endereço e ligar automaticamente</label><button id="button">Ligar ao StageSet</button></form><p id="status" class="subtle" role="status"></p><p class="subtle" title="Depois de ligar, introduz o nome do dispositivo e o código da sessão. F11 ativa o ecrã inteiro.">Depois de ligar, introduz o nome e o código da sessão. F11: ecrã inteiro.</p><script>
const address=document.getElementById('address'),status=document.getElementById('status'),scanStatus=document.getElementById('scan-status'),servers=document.getElementById('servers'),pages=document.getElementById('pages');let foundServers=[],page=0;
function pageSize(){return Math.max(1,Math.min(6,Math.floor((innerHeight-260)/31)));}
function renderServers(){const size=pageSize(),total=Math.max(1,Math.ceil(foundServers.length/size));page=Math.max(0,Math.min(page,total-1));servers.replaceChildren();for(const server of foundServers.slice(page*size,(page+1)*size)){const item=document.createElement('button');item.type='button';item.textContent=server.name+' · '+server.url+(server.version?' · v'+server.version:'');item.title=item.textContent;item.onclick=()=>{address.value=server.url;document.getElementById('connect').requestSubmit();};servers.append(item);}pages.hidden=total<=1;document.getElementById('page-label').textContent=`${page+1} / ${total}`;document.getElementById('previous-page').disabled=page===0;document.getElementById('next-page').disabled=page>=total-1;}
document.getElementById('previous-page').onclick=()=>{page--;renderServers();};document.getElementById('next-page').onclick=()=>{page++;renderServers();};addEventListener('resize',renderServers);
document.getElementById('connect').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('button');b.disabled=true;status.textContent='A ligar…';try{localStorage.setItem('host-address',address.value);localStorage.setItem('host-auto',document.getElementById('auto').checked?'true':'false');await window.stageSetReceiver.connect(address.value);status.textContent='Ligado';}catch(error){status.textContent=error.message;status.title=error.message;}finally{b.disabled=false;}};
document.getElementById('scan').onclick=async()=>{const button=document.getElementById('scan');button.disabled=true;foundServers=[];page=0;renderServers();scanStatus.textContent='A procurar computadores StageSet…';try{foundServers=await window.stageSetReceiver.discover();renderServers();scanStatus.textContent=foundServers.length?'Seleciona o computador pretendido.':'Nenhum encontrado. Usa o endereço manual se necessário.';}catch(error){scanStatus.textContent='Pesquisa indisponível. Usa o endereço manual.';scanStatus.title=error.message;}finally{button.disabled=false;}};
window.stageSetReceiver.version().then(v=>document.getElementById('version').textContent='v'+v).catch(()=>{});address.value=localStorage.getItem('host-address')||'';document.getElementById('auto').checked=localStorage.getItem('host-auto')!=='false';document.getElementById('auto').onchange=e=>localStorage.setItem('host-auto',String(e.target.checked));if(address.value&&document.getElementById('auto').checked)document.getElementById('connect').requestSubmit();else document.getElementById('scan').click();
</script></body></html>
