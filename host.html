<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StageSet Host"><meta name="theme-color" content="#10141b"><link rel="manifest" href="./host.webmanifest"><link rel="apple-touch-icon" href="./host-icon-192.png"><link rel="stylesheet" href="./lyrics-screen.css"><title>StageSet Host</title><style>*{box-sizing:border-box}body{margin:0;background:#10141b;color:#eef4f4;font:16px system-ui}#join{max-width:480px;margin:5vh auto;padding:24px}label{display:block;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:6px}#join input{width:100%}#join .remember{display:flex;gap:10px;align-items:center}#join #remember{width:20px;min-height:20px;flex-shrink:0}#stage{height:100dvh}#connection{position:fixed;left:8px;bottom:6px;z-index:10;background:#10141bcc;padding:5px;border-radius:4px;font:12px system-ui}#install{margin-top:14px}label{margin:18px 0}input,button{min-height:44px}#join{max-width:540px;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left))}#join input{margin-top:6px;background:#19232d;border:1px solid #536673;color:inherit}#join button{background:#65e2c1;color:#10211e;border:0}#stage{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#connection{left:max(8px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));max-width:calc(100% - 80px);pointer-events:none}#installation{line-height:1.6;color:#a9bac8}h1{color:#65e2c1}@media(min-width:768px){#join{margin:9vh auto}#join h1{font-size:36px}}</style></head><body><form id="join"><h1>StageSet Host</h1><p>Recetor de letras · Android, iOS, Linux, macOS e Windows</p><label>Nome deste dispositivo<input id="name" enterkeyhint="next" maxlength="60" required></label><label>Palavra-passe ou código do StageSet<input type="password" id="code" enterkeyhint="go" autocapitalize="none" spellcheck="false" autocomplete="current-password" required></label><label class="remember"><input id="remember" type="checkbox" checked> Recordar este dispositivo e ligar automaticamente</label><button>Ligar</button><p id="error" role="status"></p><button id="install" type="button" hidden>Instalar aplicação</button><p id="installation"></p></form><main id="stage" hidden><div id="lines"></div></main><div id="connection">Desligado</div><script type="module" src="./host.js"></script></body></html>
